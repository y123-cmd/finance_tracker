{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Tracker</title>

    
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

   
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">

    
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body style="font-family: 'Roboto', sans-serif;">

    
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
            <div class="container-fluid">
                <a class="navbar-brand fw-bold" href="#">Finance Tracker</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="{% url 'tracker:income_list' %}">Income</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'tracker:expense_list' %}">Expenses</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'tracker:add_income' %}">Add Income</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'tracker:add_expense' %}">Add Expense</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    
    <main class="container mt-5">
        {% block content %}
        {% endblock %}
    </main>

    
    <footer class="bg-dark text-white text-center py-3 mt-5">
        <small>&copy; 2025 <strong>Finance Tracker</strong>. All Rights Reserved.</small>
    </footer>

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/script.js' %}"></script>
</body>
</html>
