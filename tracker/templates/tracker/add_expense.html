{% extends "base.html" %}
{% block title %}Add Expense{% endblock %}

{% block content %}
<div class="container mt-5">
    <h2 class="text-center text-danger mb-4">Add New Expense</h2>
    <hr>
    <form method="post" class="form">
        {% csrf_token %}

        <div class="mb-3">
            <label for="expense_description" class="form-label">Expense Description</label>
            {{ form.expense_description }}  
        </div>

        <div class="mb-3">
            <label for="amount" class="form-label">Amount (Ksh)</label>
            {{ form.amount }}  
        </div>

        <div class="mb-3">
            <label for="date" class="form-label">Date</label>
            
            <input type="text" id="date" name="date" class="form-control col-md-4" value="{{ form.date.value|default_if_none:'' }}">  
        </div>

        <div class="mb-3">
            <label for="category" class="form-label">Category</label>
            {{ form.category }}  
        </div>

        <div class="text-center">
            <button type="submit" class="btn btn-danger btn-lg">Add Expense</button>
        </div>
    </form>
</div>


<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

<script>
    flatpickr("#date", {
        dateFormat: "Y-m-d",  
        enableTime: false,    
        defaultDate: "today"   
    });
</script>
{% endblock %}
